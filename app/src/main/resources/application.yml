quarkus:
  application:
    name: ${APP_NAME:cleanslice-platform}
  http:
    port: ${HTTP_PORT:8080}
  datasource:
    db-kind: postgresql
  flyway:
    locations: db/migration
    migrate-at-start: ${DB_MIGRATE_AT_START:false}
    validate-at-start: ${DB_MIGRATION_VALIDATE_AT_START:true}
    baseline-on-migrate: ${DB_BASELINE_ON_MIGRATE:true}
  devservices:
    enabled: false
  swagger-ui:
    always-include: true
  smallrye-openapi:
    info-title: CleanSlice Modular Monolith API
    info-version: ${APP_VERSION:1.0.0-SNAPSHOT}

"%dev":
  quarkus:
    datasource:
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:postgres}
      jdbc:
        url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/cleanslice_platform}
      reactive:
        url: ${DB_REACTIVE_URL:postgresql://localhost:5432/cleanslice_platform}
    hibernate-orm:
      schema-management:
        strategy: update
      log:
        sql: true

"%test":
  quarkus:
    datasource:
      username: ${DB_USERNAME_TEST:postgres}
      password: ${DB_PASSWORD_TEST:postgres}
      jdbc:
        url: ${DB_JDBC_URL_TEST:jdbc:postgresql://localhost:5432/cleanslice_platform_test}
      reactive:
        url: ${DB_REACTIVE_URL_TEST:postgresql://localhost:5432/cleanslice_platform_test}
    flyway:
      migrate-at-start: ${DB_MIGRATE_AT_START_TEST:true}
      clean-at-start: ${DB_CLEAN_AT_START_TEST:true}
      validate-at-start: ${DB_MIGRATION_VALIDATE_AT_START_TEST:false}
    hibernate-orm:
      schema-management:
        strategy: drop-and-create
      log:
        sql: false

"%prod":
  quarkus:
    datasource:
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      jdbc:
        url: ${DB_JDBC_URL}
      reactive:
        url: ${DB_REACTIVE_URL}
    flyway:
      migrate-at-start: ${DB_MIGRATE_AT_START:true}
    hibernate-orm:
      schema-management:
        strategy: validate
      log:
        sql: false
