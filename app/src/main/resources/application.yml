quarkus:
  application:
    name: honeybee-monolith
  http:
    port: 8080
  datasource:
    db-kind: postgresql
    username: postgres
    password: 123456
    reactive:
      url: postgresql://localhost:5432/clean-architechture
  hibernate-orm:
    database:
      generation: update
    log:
      sql: true
  devservices:
    enabled: false
  swagger-ui:
    always-include: true
  smallrye-openapi:
    info-title: CleanSlice Modular Monolith API
    info-version: 1.0.0-SNAPSHOT
